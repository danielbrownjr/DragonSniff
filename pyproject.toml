[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonsniff"
version = "0.1.0"
description = "Local observability tooling for Dragon-family devices"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DragonSniff contributors"}]
dependencies = []

[project.scripts]
dragonsniff = "dragonsniff.__main__:main"

[tool.setuptools.package-data]
dragonsniff = ["web/*"]

